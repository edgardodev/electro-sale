<!-- public/formulario.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Electro-Sale</title>

  <!-- 🧩 Estilos base compartidos (colores, tipografías, fondo, botones, etc.) -->
  <link rel="stylesheet" href="css/base.css" />
  <!-- 🔐 Estilos específicos para pantallas de autenticación (login / registro) -->
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

  <div class="page-background"></div>

  <header class="auth-header">
    <a class="brand-pill" href="index.html">
      <span class="brand-pill__primary">Electro</span>
      <span class="brand-pill__accent">Sale</span>
    </a>
    <a class="ghost-button" href="ingresar.html">Ya tengo cuenta</a>
  </header>

  <main class="auth-container">
    <section class="auth-card auth-card--wide">
      <h1>Crea tu cuenta</h1>
      <p class="auth-subtitle">
        Completa tus datos para disfrutar de ofertas exclusivas y gestionar tus pedidos en un solo lugar.
      </p>

      <form class="formulario" id="registerForm" novalidate>
        <div class="form-grid">
          <div class="form-field">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" placeholder="Tu nombre" required />
          </div>
          <div class="form-field">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="usuario@email.com" required />
          </div>
        </div>

        <div class="form-field">
          <label for="direccion">Dirección</label>
          <input id="direccion" placeholder="Calle 123, Ciudad" required />
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 8 caracteres" required />
        </div>

        <div class="form-field">
          <span class="field-label" id="paymentLabel">Método de pago preferido</span>
          <div class="radio-group" role="radiogroup" aria-labelledby="paymentLabel">
            <label class="radio-chip">
              <input type="radio" name="pago" value="PSE" required>
              <span class="radio-chip__label">PSE</span>
            </label>
            <label class="radio-chip">
              <input type="radio" name="pago" value="PayPal">
              <span class="radio-chip__label">PayPal</span>
            </label>
            <label class="radio-chip">
              <input type="radio" name="pago" value="CREDIT CARD">
              <span class="radio-chip__label">Tarjeta de crédito</span>
            </label>
          </div>
        </div>

        <button type="submit" class="primary-button">Registrarme</button>
        <p id="registerMessage" class="form-feedback" role="alert"></p>
      </form>
    </section>
  </main>

  <div
    class="loading-overlay hidden"
    id="registerLoading"
    aria-live="polite"
    aria-busy="true"
  >
    <div class="loading-spinner" role="status" aria-hidden="true"></div>
    <p>Creando tu cuenta...</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
